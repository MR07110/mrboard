<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>MR BOARD · Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Modular Production Styles -->
    <link rel="stylesheet" href="/css/style.css?v=3.0.0">

    <!-- External Libraries -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="dashboard-layout">

    <!-- Notification Toast Wrapper -->
    <div id="toast-wrapper" class="toast-wrapper"></div>

    <!-- Dashboard Header -->
    <header class="dash-header">
        <a href="index.html" class="dash-brand">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            MR <span>BOARD</span>
        </a>

        <!-- Search Bar -->
        <div class="dash-search-container">
            <i data-lucide="search" size="16" class="dash-search-icon"></i>
            <input type="text" id="search-input" class="dash-search-input" placeholder="Xona nomi yoki kodi bo'yicha qidirish...">
        </div>

        <!-- Header Actions -->
        <div class="dash-header-actions">
            <!-- User Profile Pill -->
            <div class="user-profile-badge">
                <div class="avatar" id="user-avatar" style="width:28px; height:28px; font-size:12px;">U</div>
                <span id="user-name" style="font-size:13px; font-weight:700;">Foydalanuvchi</span>
            </div>

            <!-- Logout Button -->
            <button class="btn btn-ghost" id="btn-dash-logout" style="padding:6px 12px;" title="Chiqish">
                <i data-lucide="log-out" size="16"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="dash-main">
        <!-- Welcome & Quick Actions -->
        <section class="welcome-section">
            <div class="welcome-text">
                <h1 id="welcome-message">Assalomu alaykum!</h1>
                <p>O'z xonangizni boshqaring yoki faol jamoaviy darslarga qo'shiling.</p>
            </div>

            <div class="action-buttons-group">
                <button class="btn btn-primary" id="btn-open-create-room">
                    <i data-lucide="plus-circle" size="16"></i> Yangi xona
                </button>
                <button class="btn btn-ghost" id="btn-open-join-room">
                    <i data-lucide="key" size="16"></i> Kod bilan kirish
                </button>
            </div>
        </section>

        <!-- Stats Grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i data-lucide="globe" size="24"></i></div>
                <div class="stat-info">
                    <h3 id="stat-active-rooms">0</h3>
                    <span>Faol ochiq xonalar</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon"><i data-lucide="layout" size="24"></i></div>
                <div class="stat-info">
                    <h3 id="stat-my-rooms">0</h3>
                    <span>Mening xonalarim</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon"><i data-lucide="zap" size="24"></i></div>
                <div class="stat-info">
                    <h3>0ms</h3>
                    <span>Firebase Real-time sinxronlash</span>
                </div>
            </div>
        </section>

        <!-- Tabs Navigation -->
        <div class="tabs-nav">
            <button class="tab-btn active" data-tab="home">
                <i data-lucide="compass" size="16"></i> Barcha xonalar
            </button>
            <button class="tab-btn" data-tab="myrooms">
                <i data-lucide="folder" size="16"></i> Mening xonalarim
            </button>
        </div>

        <!-- Rooms Grid Container -->
        <div class="rooms-grid" id="rooms-grid-container">
            <div class="empty-state">
                <i data-lucide="loader" size="32" class="spin"></i>
                <p>Xonalar yuklanmoqda...</p>
            </div>
        </div>
    </main>

    <!-- Modal Backdrop -->
    <div class="backdrop" id="dashModalBackdrop"></div>

    <!-- ==================== CREATE ROOM MODAL ==================== -->
    <div class="modal-box" id="createRoomModal">
        <h3 style="font-size:18px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px;">
            <i data-lucide="plus-circle" size="20" style="color:var(--brand-primary)"></i> Yangi xona yaratish
        </h3>
        
        <div class="form-group">
            <label><i data-lucide="tag" size="14"></i> Xona nomi</label>
            <input type="text" id="create-room-name" class="form-input" placeholder="Masalan: Fizika 9-sinf">
        </div>

        <div class="form-group">
            <label><i data-lucide="globe" size="14"></i> Xona turi</label>
            <div class="room-type-selector">
                <button class="room-type-btn active" id="create-type-public">
                    <i data-lucide="globe" size="14"></i> Public (Ochiq)
                </button>
                <button class="room-type-btn" id="create-type-private">
                    <i data-lucide="lock" size="14"></i> Private (Maxfiy)
                </button>
            </div>
        </div>

        <div class="form-group" id="create-password-group" style="display:none;">
            <label><i data-lucide="key" size="14"></i> Xona paroli</label>
            <input type="password" id="create-room-password" class="form-input" placeholder="Parol belgilang">
        </div>

        <div class="modal-actions">
            <button class="btn btn-ghost" id="btn-close-create-modal">Bekor</button>
            <button class="btn btn-primary" id="btn-confirm-create">Yaratish</button>
        </div>
    </div>

    <!-- ==================== JOIN ROOM BY CODE MODAL ==================== -->
    <div class="modal-box" id="joinRoomModal">
        <h3 style="font-size:18px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px;">
            <i data-lucide="log-in" size="20" style="color:var(--brand-primary)"></i> Kod bilan xonaga ulanish
        </h3>

        <div class="form-group">
            <label><i data-lucide="hash" size="14"></i> 6 xonali xona kodi</label>
            <input type="text" id="join-room-code" class="form-input" placeholder="ABC123" maxlength="6" style="text-transform:uppercase; letter-spacing:2px; font-weight:700;">
        </div>

        <div class="form-group">
            <label><i data-lucide="key" size="14"></i> Parol (agar bo'lsa)</label>
            <input type="password" id="join-room-password" class="form-input" placeholder="Xona paroli">
        </div>

        <div class="modal-actions">
            <button class="btn btn-ghost" id="btn-close-join-modal">Bekor</button>
            <button class="btn btn-primary" id="btn-confirm-join">Ulanish</button>
        </div>
    </div>

    <!-- ==================== EDIT ROOM MODAL ==================== -->
    <div class="modal-box" id="editRoomModal">
        <h3 style="font-size:18px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px;">
            <i data-lucide="edit" size="20" style="color:var(--brand-primary)"></i> Xonani tahrirlash
        </h3>

        <div class="form-group">
            <label><i data-lucide="tag" size="14"></i> Xona nomi</label>
            <input type="text" id="edit-room-name" class="form-input">
        </div>

        <div class="form-group">
            <label><i data-lucide="globe" size="14"></i> Xona turi</label>
            <div class="room-type-selector">
                <button class="room-type-btn active" id="edit-type-public">
                    <i data-lucide="globe" size="14"></i> Public
                </button>
                <button class="room-type-btn" id="edit-type-private">
                    <i data-lucide="lock" size="14"></i> Private
                </button>
            </div>
        </div>

        <div class="form-group" id="edit-password-group" style="display:none;">
            <label><i data-lucide="key" size="14"></i> Yangi parol</label>
            <input type="password" id="edit-room-password" class="form-input" placeholder="Parol">
        </div>

        <div class="modal-actions">
            <button class="btn btn-ghost" id="btn-close-edit-modal">Bekor</button>
            <button class="btn btn-primary" id="btn-save-edit">Saqlash</button>
        </div>
    </div>

    <!-- Dashboard Master Page Script -->
    <script type="module" src="/js/pages/dashboard.js?v=3.0.0"></script>
</body>
</html>
