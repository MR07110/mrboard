<!DOCTYPE html>
<html lang="uz" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MR BOARD AI · Do'stona Yordamchi</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Modular Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--bg-base);">

    <!-- Header Bar -->
    <header class="ai-header-bar">
        <div class="ai-header-title">
            <div class="ai-status-dot"></div>
            <span>MR BOARD AI Studio</span>
        </div>
        <a href="dashboard.html" class="btn btn-ghost" style="padding:4px 10px; font-size:12px;">
            <i data-lucide="arrow-left" size="14"></i> Dashboard
        </a>
    </header>

    <!-- Chat Messages Body -->
    <main class="ai-messages-body" id="standalone-ai-messages">
        <div class="ai-bubble assistant">
            👋 Assalomu alaykum! Men MR BOARD sun'iy intellekt yordamchisiman. Doska bo'yicha qanday yordam bera olaman?
        </div>
    </main>

    <!-- Composer -->
    <footer class="ai-composer">
        <input type="text" id="standalone-ai-input" class="ai-input" placeholder="Savolingizni yozing..." maxlength="400">
        <button id="standalone-ai-send" class="ai-send-btn"><i data-lucide="send" size="18"></i></button>
    </footer>

    <script type="module">
        import { aiAssistant } from './js/api/ai.js';
        import { Utils } from './js/utils.js';

        const body = document.getElementById('standalone-ai-messages');
        const input = document.getElementById('standalone-ai-input');
        const sendBtn = document.getElementById('standalone-ai-send');

        let history = [];
        let processing = false;

        async function handleSend() {
            const text = input.value.trim();
            if (!text || processing) return;

            input.value = '';
            appendMsg('user', text);
            history.push({ role: 'user', content: text });

            processing = true;
            const loading = appendMsg('assistant', '🤔 O\'ylayapman...');

            try {
                const answer = await aiAssistant.chat(history);
                loading.innerHTML = Utils.sanitize(answer).replace(/\n/g, '<br>');
                history.push({ role: 'assistant', content: answer });
            } catch (err) {
                loading.innerText = "Xatolik yuz berdi.";
            } finally {
                processing = false;
            }
        }

        function appendMsg(role, text) {
            const bubble = document.createElement('div');
            bubble.className = `ai-bubble ${role}`;
            bubble.innerHTML = Utils.sanitize(text).replace(/\n/g, '<br>');
            body.appendChild(bubble);
            body.scrollTop = body.scrollHeight;
            return bubble;
        }

        sendBtn.addEventListener('click', handleSend);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
